# dsh-llm-agentrouter bundle patch — the AgentRouter relay as one provider route
# per wire protocol (three in all), each with a runtime endpoint choice, plus
# the fence that makes both possible.
#
# Applied after the dsh-base / dsh-web-app bundle layers, so the `llm-pi-ai`
# row below overrides the dormant zero-route entry dsh-base mounts.
#
# WHY ONE ROUTE AND NOT TWO
# The relay serves the same three models at a domestic and an international
# endpoint; only the origin differs. Declaring a route per endpoint put every
# model in the picker twice and made "which endpoint" a choice the user had to
# re-make on every model switch. It is not a model property — it is one
# deployment-wide setting, so it lives in this plugin's own settings section and
# the picker shows one AgentRouter group.
#
# WHY THREE ROUTES AND NOT ONE
# The adapter reads the protocol (`api:`) from the route, and a route is one
# protocol: a request is built in that wire format before the fence ever sees
# it, so a runtime protocol switch would mean translating request bodies —
# which no configuration can express. The relay accepts the same models over
# three protocols (`openai-completions`, `anthropic-messages`,
# `openai-responses`), so the protocol is a per-route choice, one group per
# protocol in the picker. All three share ONE sentinel host and ONE credential
# reference: the fence rewrites by host and preserves the path, so the three
# protocols' differing baseURL suffixes flow through untouched, and one relay
# account serves all of them.
#
# WHICH MODELS UNDER WHICH PROTOCOL
# `anthropic-messages` carries only the two Claude models — that is what the
# protocol is for, and the official pi-ai catalog declares no GPT/DeepSeek/GLM
# under it. `openai-responses` mirrors the first-party OpenAI shape for the one
# GPT model the relay serves; the DeepSeek and GLM models stay on
# `openai-completions`, which remains the default group.
#
# WHY THE BASE URL IS A SENTINEL
# `baseURL` is resolved once per request by the adapter, but it cannot read this
# plugin's endpoint choice — the two live in different namespaces. So the route
# addresses a host that deliberately does not exist, and the fence rewrites it
# to the chosen endpoint on the way out (`.internal` is reserved for exactly
# this, so an unfenced request fails to resolve instead of reaching anything
# real). The fence has to be in the request path regardless: the relay
# authenticates its client by User-Agent, and the adapter strips profile headers
# colliding with its mandatory attribution. See lib/index.js.
#
# CREDENTIALS
# `apiKeyEnv` is a credential *reference* resolved per request; the secret lives
# in $DSH_HOME/.credentials.yaml (or the environment), never in this file. Do
# NOT move a key into `headers`: that dict is returned verbatim by the adapter's
# `describe()` and rendered by the Models settings page. One reference serves
# both endpoints because it is one relay account.
#
# MODEL CATALOG
# pi-ai's installed catalog describes all three models, but under their vendor
# providers (`anthropic`, `openai`) and other protocols — Opus via
# anthropic-messages, gpt-5.6-sol via openai-responses. A hand-declared route
# inherits nothing, so capacities, reasoning levels, and compat switches are
# restated here from that catalog, adjusted for Chat Completions.
#
# The two protocol siblings below restate their models' entries from the same
# catalog, limited to what a hand-declared route may configure: pi-ai's adapter
# splits every compat field into offered (settable here) and withheld (only
# its installed catalog may set them for vendor routes). Capacities and
# thinkingLevelMap are restated VERBATIM because they are the protocol's own
# semantics; withheld compat switches are simply omitted, and the models work
# without them. Only the baseURL differs — each protocol's SDK appends its own
# path suffix, so anthropic-messages stops at the host root (its SDK appends
# /v1/messages) while the two OpenAI-shaped protocols carry /v1.
#
# `reasoningEfforts` keys are the levels the picker offers; each value is the
# wire spelling sent as `reasoning_effort`. All three models were probed against
# the live relay: every level below answered 200. `off:` (declared, no value)
# offers Off and sends nothing, which is what an OpenAI-shaped endpoint wants.
# WHY THE PICKER SAYS NOTHING ABOUT THE ENDPOINT
# The model picker renders no child slots, so a plugin cannot inject anything
# into that menu; per group it shows only `displayName`, and per model only the
# name and an adapter-supplied description a hand-declared pi-ai route has no
# field for. The group title is therefore the only reachable surface — and it is
# a name, not a notice, so it stays a name. The endpoint is explained where it is
# changed: 设置 → 插件 → AgentRouter 中转站.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      agentrouter:
        displayName: AgentRouter
        apiKeyEnv: AGENTROUTER_API_KEY
        api: openai-completions
        # Rewritten per request by llm-agentrouter to the selected endpoint.
        baseURL: https://relay.agentrouter.internal/v1
        defaultInput:
          - text
        # The relay is not an endpoint pi-ai can recognize, so its detection
        # would address it as OpenAI itself: `developer` system role and
        # `max_completion_tokens`. Probes show it accepts plain `system`,
        # `max_tokens`, top-level `reasoning_effort`, and `strict` tools.
        compat:
          thinkingFormat: openai
          supportsReasoningEffort: true
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          supportsStore: false
          supportsStrictMode: true
          supportsUsageInStreaming: true
        models:
          - id: claude-opus-5
            name: Claude Opus 5
            contextWindow: 1000000
            maxTokens: 128000
            reasoningEfforts: &opus-efforts
              off:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: claude-opus-4-8
            name: Claude Opus 4.8
            contextWindow: 1000000
            maxTokens: 128000
            reasoningEfforts: *opus-efforts
          - id: gpt-5.6-sol
            name: GPT 5.6 Sol
            contextWindow: 272000
            maxTokens: 128000
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          # Tiers mirror what the first-party `deepseek-official` route offers for
          # DeepSeek-V4-Flash — off / low / high / max — rather than the relay's
          # full enum. The relay does accept `minimal`, `medium`, and `xhigh` for
          # this model, but the levels a model is *offered* under should match the
          # vendor's own selection; add them here if that ever changes.
          #
          # `off` carries the wire value `none` instead of being left empty, and
          # that is not cosmetic: omitting `reasoning_effort` entirely still
          # returns `reasoning_content` with a nonzero `reasoning_tokens`, so an
          # empty `off:` would offer a switch that does nothing. `none` is the
          # only spelling that actually stops the thinking, and it is the relay's
          # own word — `off` is rejected with a 400 naming the accepted enum.
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 256000
            reasoningEfforts:
              off: none
              low: low
              high: high
              max: max
          # This model declares no `off` at all, and that is the honest shape
          # rather than an omission: every level outside low / high / max — `none`,
          # `minimal`, `medium`, `xhigh` — is refused with 400 «该模型始终思考，不
          # 支持关闭思考；请使用 low、high 或 max。». It always thinks. Leaving `off`
          # out withholds the level, so the picker never offers a switch the
          # upstream would reject.
          #
          # `maxTokens` is the ceiling the relay states for this model: a larger
          # value comes back as «max_tokens参数非法：限制数值范围[1,131072]».
          - id: glm-5.3
            name: GLM 5.3
            contextWindow: 1000000
            maxTokens: 131072
            reasoningEfforts:
              low: low
              high: high
              max: max

      # ── anthropic-messages sibling ─────────────────────────────────────────
      # Same sentinel host, same credential reference, different wire protocol.
      # `thinkingLevelMap` here is restated VERBATIM from the official pi-ai
      # catalog (anthropic provider): Opus 5 / 4.8 are adaptive-thinking models
      # that offer only xhigh / max as discrete levels. The Anthropic SDK
      # appends /v1/messages itself, so the baseURL stops at the host root —
      # a /v1 suffix would produce /v1/v1/messages.
      agentrouter-anthropic:
        displayName: AgentRouter (Anthropic)
        apiKeyEnv: AGENTROUTER_API_KEY
        api: anthropic-messages
        # Rewritten per request by llm-agentrouter to the selected endpoint.
        baseURL: https://relay.agentrouter.internal
        defaultInput:
          - text
        # Restated from the catalog's anthropic provider entries: adaptive
        # thinking is forced on (the model decides), temperature is not sent,
        # strict tools are supported.
        compat:
          forceAdaptiveThinking: true
          supportsTemperature: false
          supportsStrictTools: true
        models:
          - id: claude-opus-5
            name: Claude Opus 5
            contextWindow: 1000000
            maxTokens: 128000
            reasoningEfforts:
              xhigh: xhigh
              max: max
          - id: claude-opus-4-8
            name: Claude Opus 4.8
            contextWindow: 1000000
            maxTokens: 128000
            reasoningEfforts:
              xhigh: xhigh
              max: max

      # ── openai-responses sibling ───────────────────────────────────────────
      # Same sentinel host, same credential reference, the Responses wire
      # protocol the first-party OpenAI provider itself uses for gpt-5.6-sol.
      # `thinkingLevelMap` is restated VERBATIM from that catalog entry —
      # including `off: none` and `minimal: null`, whose OpenAI Responses
      # spellings differ from the Chat Completions ones above.
      agentrouter-responses:
        displayName: AgentRouter (Responses)
        apiKeyEnv: AGENTROUTER_API_KEY
        api: openai-responses
        # Rewritten per request by llm-agentrouter to the selected endpoint.
        # The Responses SDK appends /responses, so the /v1 prefix stays.
        baseURL: https://relay.agentrouter.internal/v1
        defaultInput:
          - text
        # Only the fields the Responses protocol OFFERS to a hand-declared
        # route. The catalog entry also carries supportsOpenAIGrammarTools,
        # supportsToolSearch, and supportsExplicitPromptCacheMode, but the
        # adapter marks those "withhold" — settable only by pi-ai's installed
        # catalog for the vendors that need them; naming them here is a load
        # error, and the model works without them.
        compat:
          supportsStrictMode: true
        models:
          - id: gpt-5.6-sol
            name: GPT 5.6 Sol
            contextWindow: 272000
            maxTokens: 128000
            # `off: none` keeps the Responses spelling of Off. `minimal` is
            # deliberately ABSENT: the catalog pins it unsupported for this
            # model (`thinkingLevelMap: { minimal: null }`), and in a route
            # declaration an omitted level is exactly that pin — a declared
            # level must carry the wire value dispatch should send, and only
            # `off` may be empty.
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max

# The endpoint switch and the User-Agent fence. Both are one plugin because both
# are one rewrite of one outbound request, and splitting them would mean two
# wrappers over the same global for the same hostname.
- insert:
    - id: llm-agentrouter
      name: 'dsh-llm-agentrouter'
